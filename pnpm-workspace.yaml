packages:
  - 'packages/*'
  - 'tests'

nodeLinker: hoisted
linkWorkspacePackages: true
nodeOptions: --disable-warning=DEP0040

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  full-icu: true
  nx: true
  unrs-resolver: true

patchedDependencies:
  '@prettier/plugin-pug@3.5.1': patches/@prettier__plugin-pug@3.5.1.patch
  eslint-plugin-vue-pug@1.0.0-alpha.5: patches/eslint-plugin-vue-pug@1.0.0-alpha.5.patch
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
  - prettier-plugin-penere
