packages:
  - 'packages/*'
  - 'tests'

nodeLinker: hoisted
linkWorkspacePackages: true
nodeOptions: --disable-warning=DEP0040

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  full-icu: true
  nx: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - prettier-plugin-penere
  - objection@4.2.0
patchedDependencies:
  # `:focus-within`, until capricorn86/happy-dom#2543 is released:
  happy-dom@20.14.5: patches/happy-dom@20.14.5.patch
