name: Publish

# Stages the packages of pushed version tags on npm, through npm's trusted
# publishing: npm trusts this workflow, so no tokens are needed. The versions
# are created locally with `pnpm release`, which pushes the tags, and go live
# once a maintainer approves them with `pnpm stage approve`. Run it manually
# with a tag to finish a release that failed partway.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, e.g. v4.5.1
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # Stages the versions that aren't on npm yet. pnpm retries a failed
      # provenance signature with a new one, where lerna's sigstore client
      # sends the same Rekor entry again and fails on its 409 conflict.
      - run: pnpm -r stage publish --no-git-checks

  # Creates the GitHub release of the tag, or updates its notes when rerun,
  # from the version's section in `CHANGELOG.md`.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - run: node scripts/release-notes.js "$TAG" > notes.md
      - run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --notes-file notes.md
          fi
